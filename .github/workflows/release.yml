name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Siftly.slnx -c Release

      - name: Test
        run: |
          for framework in net10.0 net8.0; do
            dotnet test Siftly.IntegrationTest -c Release --no-build -f "$framework"
            dotnet test Siftly.MultiLanguageContentTest -c Release --no-build -f "$framework"
          done

      - name: Pack
        run: |
          dotnet pack Siftly.Core -c Release -o ./artifacts -p:Version="$VERSION"
          dotnet pack Siftly.EntityFramework -c Release -o ./artifacts -p:Version="$VERSION"

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
